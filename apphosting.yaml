# Firebase App Hosting settings.
# https://firebase.google.com/docs/app-hosting/configure
#
# Create the secrets once with:
#   firebase apphosting:secrets:set CASHFREE_CLIENT_ID
#   firebase apphosting:secrets:set CASHFREE_CLIENT_SECRET

runConfig:
  minInstances: 0   # scale to zero when idle: no cost without traffic
  maxInstances: 4   # cost guard; raise when traffic grows
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: DATA_SOURCE
    value: firestore
  - variable: PAYMENT_GATEWAY
    value: cashfree
  - variable: CASHFREE_ENV
    value: sandbox          # switch to "production" at launch
  - variable: APP_URL
    value: https://REPLACE-WITH-YOUR-DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE
    availability: [BUILD, RUNTIME]
  - variable: CASHFREE_CLIENT_ID
    secret: CASHFREE_CLIENT_ID
  - variable: CASHFREE_CLIENT_SECRET
    secret: CASHFREE_CLIENT_SECRET
